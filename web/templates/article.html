{{define "page"}}
<article class="article-layout">
  <header class="article-header">
    <p class="eyebrow">Article</p>
    <h1>{{.Post.Title}}</h1>
    {{if .Post.Summary}}<p class="article-summary">{{.Post.Summary}}</p>{{end}}
    <div class="article-meta"><time datetime="{{formatTime .Post.PublishedAt}}">{{formatDate .Post.PublishedAt}}</time><span aria-hidden="true">·</span><span>{{.ReadingMinutes}} min read</span></div>
  </header>
  <div class="article-reading-grid">
    <div class="prose">{{.Body}}</div>
    {{if .Headings}}<aside class="table-of-contents" aria-label="On this page"><p class="eyebrow">On this page</p><ol>{{range .Headings}}<li class="toc-level-{{.Level}}"><a href="#{{.ID}}">{{.Text}}</a></li>{{end}}</ol></aside>{{end}}
  </div>
</article>
{{end}}
